<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f2f2">
  <title>Bavrix Digital Studio — Social video ad</title>
  <style>
    :root { color-scheme: light; --ink: #111; --paper: #f2f2f2; --line: #d2d2d2; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 28px; display: grid; place-items: center; gap: 20px; background: #e6e6e6; color: var(--ink); font: 15px/1.5 Arial, Helvetica, sans-serif; }
    .ad-shell { width: min(100%, 430px); }
    .ad-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 0 0 12px; }
    .ad-heading h1 { margin: 0; font-size: 18px; letter-spacing: -.04em; }
    .ad-heading span { color: #555; font: 10px 'Courier New', monospace; letter-spacing: .08em; text-transform: uppercase; }
    .stage { overflow: hidden; background: var(--paper); box-shadow: 0 20px 55px #0002; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 9 / 16; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 13px; }
    button { min-height: 46px; padding: 0 18px; border: 1px solid var(--ink); background: var(--ink); color: white; font: 700 12px Arial, sans-serif; cursor: pointer; transition: background .2s, color .2s, transform .2s; }
    button:hover { background: white; color: var(--ink); transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #555; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { min-height: 20px; color: #555; font-size: 12px; }
    .note { margin: 10px 0 0; color: #555; font-size: 11px; }
    @media (max-width: 500px) { body { padding: 16px; } }
  </style>
</head>
<body>
  <main class="ad-shell">
    <div class="ad-heading">
      <h1>Bavrix social video</h1>
      <span>15 sec · portrait</span>
    </div>
    <div class="stage"><canvas id="ad" width="1080" height="1920" aria-label="Animated Bavrix Digital Studio social video advertisement"></canvas></div>
    <div class="controls">
      <button id="download" type="button">Download video ↗</button>
      <span id="status" role="status" aria-live="polite">Ready to export · 1080 × 1920</span>
    </div>
    <p class="note">The email is babarsardar385@gmail.com. Replace it in this file if you want a different contact address.</p>
  </main>
  <script>
    const canvas = document.querySelector('#ad');
    const ctx = canvas.getContext('2d');
    const statusText = document.querySelector('#status');
    const downloadButton = document.querySelector('#download');
    const W = canvas.width;
    const H = canvas.height;
    const DURATION = 15;
    const photos = {};
    const photoFiles = {
      web: 'assets/web-development.jpg',
      shop: 'assets/ecommerce-shopping.jpg',
      software: 'assets/business-dashboard.jpg'
    };

    Object.entries(photoFiles).forEach(([key, path]) => {
      const image = new Image();
      image.src = path;
      photos[key] = image;
    });

    const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
    const smooth = (value) => { const t = clamp(value); return t * t * (3 - 2 * t); };
    const sceneProgress = (time, start, end) => smooth((time - start) / (end - start));

    function text(value, x, y, size, options = {}) {
      const { color = '#111111', weight = 700, align = 'left', tracking = 0, family = 'Arial, Helvetica, sans-serif' } = options;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = 'alphabetic';
      ctx.font = `${weight} ${size}px ${family}`;
      if (!tracking) { ctx.fillText(value, x, y); return; }
      const chars = [...value];
      const width = chars.reduce((sum, char) => sum + ctx.measureText(char).width, 0) + tracking * (chars.length - 1);
      let cursor = align === 'center' ? x - width / 2 : align === 'right' ? x - width : x;
      chars.forEach((char) => { ctx.fillText(char, cursor, y); cursor += ctx.measureText(char).width + tracking; });
    }

    function photoCrop(image, x, y, width, height, progress = 0) {
      if (!image || !image.complete || !image.naturalWidth) return;
      const scale = Math.max(width / image.width, height / image.height) * (1 + progress * .035);
      const cropWidth = width / scale;
      const cropHeight = height / scale;
      const sourceX = (image.width - cropWidth) / 2;
      const sourceY = (image.height - cropHeight) / 2;
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, width, height);
      ctx.clip();
      ctx.drawImage(image, sourceX, sourceY, cropWidth, cropHeight, x - progress * 5, y - progress * 7, width, height);
      ctx.restore();
    }

    function label(value, x, y, align = 'left', color = '#555555') {
      text(value, x, y, 22, { color, weight: 600, align, tracking: 3, family: 'Courier New, monospace' });
    }

    function grain(time) {
      ctx.save();
      ctx.globalAlpha = .045;
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 1;
      for (let y = 0; y < H; y += 8) {
        const offset = Math.sin(y * .13 + time * .7) * 2;
        ctx.beginPath();
        ctx.moveTo(0, y + offset);
        ctx.lineTo(W, y + offset);
        ctx.stroke();
      }
      ctx.restore();
    }

    function base(time, dark = false) {
      ctx.fillStyle = dark ? '#111111' : '#F2F2F2';
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.translate(850 + Math.sin(time * .45) * 30, 420 + Math.cos(time * .4) * 20);
      ctx.rotate(time * .045);
      [270, 355, 445].forEach((radius, index) => {
        ctx.beginPath();
        ctx.arc(0, 0, radius, -.95 + index * .06, 2.3 + index * .04);
        ctx.strokeStyle = dark ? `rgba(255,255,255,${.32 - index * .08})` : `rgba(17,17,17,${.22 - index * .045})`;
        ctx.lineWidth = index === 0 ? 2 : 1;
        ctx.stroke();
      });
      ctx.restore();
      grain(time);
    }

    function topMark(dark = false) {
      const color = dark ? '#F2F2F2' : '#111111';
      ctx.fillStyle = color;
      ctx.save();
      ctx.translate(76, 78);
      ctx.beginPath();
      ctx.moveTo(0, 18); ctx.lineTo(26, 0); ctx.lineTo(52, 18); ctx.lineTo(26, 36); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = .55;
      ctx.fillRect(8, 44, 36, 7);
      ctx.globalAlpha = .8;
      ctx.fillRect(14, 57, 24, 6);
      ctx.restore();
      text('BAVRIX', 142, 105, 27, { color, weight: 800, tracking: 5 });
      text('DIGITAL STUDIO', 145, 132, 15, { color, weight: 600, tracking: 4 });
    }

    function photoFrame(image, x, y, width, height, progress, rotate = 0) {
      ctx.save();
      ctx.translate(x + width / 2, y + height / 2);
      ctx.rotate(rotate);
      ctx.translate(-width / 2, -height / 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(-10, -10, width + 20, height + 20);
      ctx.shadowColor = '#00000022';
      ctx.shadowBlur = 30;
      ctx.shadowOffsetY = 18;
      photoCrop(image, 0, 0, width, height, progress);
      ctx.restore();
    }

    function render(timestamp) {
      const time = ((timestamp / 1000) % DURATION);
      const fade = (start, end) => clamp((time - start) / .35) * clamp((end - time) / .35);

      if (time < 3) {
        base(time);
        topMark();
        const p = sceneProgress(time, 0, .8);
        ctx.save(); ctx.globalAlpha = fade(0, 3);
        text('A BETTER DIGITAL', 74, 480 + (1 - p) * 60, 75, { weight: 700, tracking: -4 });
        text('NEXT MOVE.', 70, 590 + (1 - p) * 60, 124, { weight: 800, tracking: -8 });
        ctx.fillStyle = '#111111'; ctx.fillRect(76, 650, 110 + p * 250, 5);
        label('WEBSITES · SOFTWARE · AUTOMATION', 78, 715);
        photoFrame(photos.web, 290, 845, 690, 650, p, -.035);
        ctx.restore();
      } else if (time < 6) {
        base(time);
        topMark();
        const p = sceneProgress(time, 3, 3.8);
        ctx.save(); ctx.globalAlpha = fade(3, 6);
        label('01 / DIGITAL EXPERIENCES', 78, 435);
        text('Made to', 72, 570 + (1 - p) * 50, 114, { weight: 700, tracking: -7 });
        text('move you.', 72, 690 + (1 - p) * 50, 118, { weight: 700, tracking: -7 });
        photoFrame(photos.shop, 160, 825, 760, 640, p, .026);
        text('WEB DESIGN  /  E-COMMERCE', 78, 1575, 20, { weight: 700, tracking: 2 });
        ctx.restore();
      } else if (time < 9) {
        base(time, true);
        topMark(true);
        const p = sceneProgress(time, 6, 6.8);
        ctx.save(); ctx.globalAlpha = fade(6, 9);
        label('02 / SOFTWARE THAT WORKS', 78, 435, 'left', '#BEBEBE');
        text('Less busywork.', 72, 570 + (1 - p) * 50, 83, { color: '#F2F2F2', weight: 700, tracking: -5 });
        text('More business.', 72, 675 + (1 - p) * 50, 78, { color: '#F2F2F2', weight: 700, tracking: -5 });
        photoFrame(photos.software, 130, 830, 820, 640, p, -.018);
        label('CUSTOM SOFTWARE · AUTOMATION', 78, 1575, 'left', '#C6C6C6');
        ctx.restore();
      } else if (time < 12) {
        base(time);
        topMark();
        const p = sceneProgress(time, 9, 9.8);
        ctx.save(); ctx.globalAlpha = fade(9, 12);
        label('THOUGHTFUL BY DESIGN', 78, 470);
        text('Clear thinking.', 72, 640 + (1 - p) * 45, 88, { weight: 700, tracking: -5 });
        text('Useful technology.', 72, 750 + (1 - p) * 45, 76, { weight: 700, tracking: -5 });
        photoFrame(photos.web, 240, 930, 700, 530, p, .018);
        ctx.restore();
      } else {
        base(time, true);
        const p = sceneProgress(time, 12, 12.8);
        ctx.save(); ctx.globalAlpha = fade(12, 15);
        topMark(true);
        ctx.save(); ctx.translate(540, 640); ctx.rotate(Math.sin(time * .6) * .025);
        ctx.fillStyle = '#F2F2F2';
        ctx.beginPath(); ctx.moveTo(0, -130); ctx.lineTo(150, -35); ctx.lineTo(0, 60); ctx.lineTo(-150, -35); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#AFAFAF';
        ctx.beginPath(); ctx.moveTo(-150, -35); ctx.lineTo(0, 60); ctx.lineTo(0, 190); ctx.lineTo(-150, 95); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#D7D7D7';
        ctx.beginPath(); ctx.moveTo(150, -35); ctx.lineTo(0, 60); ctx.lineTo(0, 190); ctx.lineTo(150, 95); ctx.closePath(); ctx.fill();
        ctx.restore();
        text('BAVRIX', 540, 1010 + (1 - p) * 25, 116, { color: '#F2F2F2', weight: 800, align: 'center', tracking: 13 });
        text('DIGITAL STUDIO', 540, 1072, 30, { color: '#D5D5D5', weight: 600, align: 'center', tracking: 9 });
        ctx.fillStyle = '#F2F2F2'; ctx.fillRect(390, 1125, 300, 2);
        text('LET’S BUILD YOUR NEXT MOVE.', 540, 1210, 29, { color: '#F2F2F2', weight: 700, align: 'center', tracking: 2 });
        text('WEBSITES  ·  SOFTWARE  ·  AUTOMATION', 540, 1280, 17, { color: '#BEBEBE', weight: 600, align: 'center', tracking: 1 });
        ctx.fillStyle = '#F2F2F2';
        ctx.fillRect(134, 1400, 812, 92);
        text('babarsardar385@gmail.com', 540, 1457, 29, { color: '#111111', weight: 700, align: 'center', tracking: .4 });
        label('DIGITAL THAT MOVES BUSINESS FORWARD', 540, 1580, 'center', '#BEBEBE');
        ctx.restore();
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    downloadButton.addEventListener('click', () => {
      if (!canvas.captureStream || !window.MediaRecorder) {
        statusText.textContent = 'Video export is not supported in this browser.';
        return;
      }
      downloadButton.disabled = true;
      statusText.textContent = 'Recording 15-second video… keep this tab open.';
      const stream = canvas.captureStream(30);
      const options = [
        { mimeType: 'video/mp4;codecs=avc1.42E01E', extension: 'mp4' },
        { mimeType: 'video/mp4', extension: 'mp4' },
        { mimeType: 'video/webm;codecs=vp9', extension: 'webm' },
        { mimeType: 'video/webm;codecs=vp8', extension: 'webm' },
        { mimeType: 'video/webm', extension: 'webm' }
      ];
      const selected = options.find((option) => MediaRecorder.isTypeSupported(option.mimeType));
      if (!selected) {
        statusText.textContent = 'This browser does not support downloadable video recording.';
        downloadButton.disabled = false;
        return;
      }
      const recorder = new MediaRecorder(stream, { mimeType: selected.mimeType, videoBitsPerSecond: 8000000 });
      const chunks = [];
      recorder.addEventListener('dataavailable', (event) => { if (event.data.size) chunks.push(event.data); });
      recorder.addEventListener('stop', () => {
        const video = new Blob(chunks, { type: selected.mimeType });
        const url = URL.createObjectURL(video);
        const link = document.createElement('a');
        link.href = url;
        link.download = `bavrix-social-ad.${selected.extension}`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        stream.getTracks().forEach((track) => track.stop());
        statusText.textContent = `Video downloaded as ${selected.extension.toUpperCase()} · 1080 × 1920 · 15 sec`;
        downloadButton.disabled = false;
      });
      recorder.start();
      const startedAt = Date.now();
      const ticker = setInterval(() => {
        const left = Math.max(0, DURATION - (Date.now() - startedAt) / 1000);
        statusText.textContent = `Recording… ${left.toFixed(1)} sec remaining`;
        if (left <= 0) clearInterval(ticker);
      }, 100);
      setTimeout(() => recorder.stop(), DURATION * 1000);
    });
  </script>
</body>
</html>
